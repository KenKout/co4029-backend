services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: abridgeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abridgeai
      POSTGRES_PASSWORD: abridgeai
      POSTGRES_DB: abridgeai
    ports:
      - "5433:5432"
    volumes:
      - abridgeai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abridgeai -d abridgeai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: abridgeai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - abridgeai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  abridgeai_pg_data:
  abridgeai_redis_data:
