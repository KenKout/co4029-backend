[project]
name = "abridgeai-backend"
version = "0.1.0"
description = "aBridgeAI backend (restructured) — feature-first architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "neo4j>=5.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "aioboto3>=13.0",
    "boto3>=1.34",
    "pyjwt>=2.8",
    "structlog>=24.4",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.18,<2",
    "import-linter>=2.0",
    "moto[server]>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]
audio-local = [
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=abridgeai --cov-report=term-missing --cov-report=xml --cov-fail-under=75 -m 'not destructive'"
markers = [
    "s3_live: integration test against a real Garage container (skipped by default; run with -m s3_live)",
    "kg_live: integration test against a real Neo4j container (skipped by default; run with -m kg_live)",
    "audio_live: integration test that calls the real Whisper / faster-whisper backend (skipped by default; run with -m audio_live)",
    "video_live: integration test that exercises the real ffmpeg binary (skipped by default; run with -m video_live)",
    "destructive: test that mutates global DB state (alembic round-trip etc.); skipped by default to keep the suite isolated; run with -m destructive",
]

[tool.coverage.run]
source = ["abridgeai"]
omit = [
    "abridgeai/**/__init__.py",
    "abridgeai/**/migrations/**",
]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,W = pycodestyle errors/warnings; F = pyflakes; I = isort; B = bugbear;
# UP = pyupgrade; N = pep8-naming; S = bandit; C90 = mccabe complexity;
# PT = pytest-style; RET = flake8-return; SIM = simplify; ANN = annotations;
# ASYNC = async; T20 = no print/pprint
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C90", "PT", "RET", "SIM", "ANN", "ASYNC", "T20"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.mccabe]
# Recursive ORM walker (soft_delete_cascade) sits at 12; raise from default 10.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts (S101), broad pytest.raises (PT011),
# and don't need full type annotations (ANN). T20 is allowed in CLI-style
# test helpers (replay_cli, capture); E501 covers long SQL/snapshot strings
# baked into integration tests.
"tests/**/*.py" = ["ANN", "S101", "PT011", "T20", "E501"]
"abridgeai/**/_test_models.py" = ["ANN"]
# Alembic migrations are auto-generated / template-driven. Path is
# `migrations/versions/` in this project (alembic was renamed during the
# T0.5 init).
"migrations/versions/**/*.py" = ["ANN", "E501"]
# eval/ is a manual-trigger eval harness, not part of the production app.
# CLI legitimately writes to stdout/stderr (T20); tests use assert (S101).
"eval/run.py" = ["T20"]
"eval/tests/**/*.py" = ["ANN", "S101", "PT011", "T20", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
# Keep error output actionable; show error codes for targeted ignores.
show_error_codes = true
warn_unused_ignores = true
# Allow tests/ directory to be discovered as the `tests.*` package
# even though some subdirs lack `__init__.py`. Required so the
# `[[tool.mypy.overrides]] module = "tests.*"` block matches.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "conftest",
    "unit.*",
    "integration.*",
    "characterization.*",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
    "faster_whisper",
    "faster_whisper.*",
    "pytesseract",
    "pytesseract.*",
    "pgvector",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["abridgeai*"]

[tool.importlinter]
root_packages = ["abridgeai"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services do not touch SQLAlchemy directly (must go through repositories/queries)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.services",
    "abridgeai.features.*.services.*",
]
forbidden_modules = [
    "sqlalchemy",
    "sqlalchemy.*",
]
allow_indirect_imports = true
ignore_imports = [
    "abridgeai.features.identity.services.login -> sqlalchemy",
    "abridgeai.features.identity.services.session -> sqlalchemy",
    "abridgeai.features.identity.services.mfa -> sqlalchemy",
    "abridgeai.features.identity.services.profile -> sqlalchemy",
    "abridgeai.features.identity.services.admin -> sqlalchemy",
    "abridgeai.features.access_control.services.permissions_lookup -> sqlalchemy",
    "abridgeai.features.courses.services.catalog -> sqlalchemy",
    "abridgeai.features.courses.services.authoring -> sqlalchemy",
    "abridgeai.features.courses.services.assignment -> sqlalchemy",
    "abridgeai.features.courses.services.administration -> sqlalchemy",
    "abridgeai.features.enrollments.services.manager -> sqlalchemy",
    "abridgeai.features.enrollments.services.student_view -> sqlalchemy",
    "abridgeai.features.materials.services.catalog -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._common -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._storage -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._reads -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._upload -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._versions -> sqlalchemy",
    "abridgeai.features.quizzes.services.authoring -> sqlalchemy",
    "abridgeai.features.quizzes.services.publish_gate -> sqlalchemy",
    "abridgeai.features.quizzes.services.taking -> sqlalchemy",
    "abridgeai.features.quizzes.services.grader -> sqlalchemy",
    "abridgeai.features.quizzes.services.generation -> sqlalchemy",
    "abridgeai.features.interviews.services.authoring -> sqlalchemy",
    "abridgeai.features.interviews.services.taking -> sqlalchemy",
    "abridgeai.features.interviews.services.evaluation -> sqlalchemy",
    "abridgeai.features.interviews.services.generation -> sqlalchemy",
    "abridgeai.features.admin.services.users -> sqlalchemy",
    "abridgeai.features.admin.services.processing -> sqlalchemy",
    "abridgeai.features.admin.services.audit -> sqlalchemy",
    "abridgeai.features.admin.services.stats -> sqlalchemy",
    "abridgeai.features.admin.services.ai_costs -> sqlalchemy",
    "abridgeai.features.progress.services.tracking -> sqlalchemy",
    "abridgeai.features.progress.services.monitoring -> sqlalchemy",
    "abridgeai.features.progress.services.reporting -> sqlalchemy",
    "abridgeai.features.notifications.services.dispatch -> sqlalchemy",
    "abridgeai.features.notifications.services.email -> sqlalchemy",
    "abridgeai.features.notifications.services.inbox -> sqlalchemy",
    "abridgeai.features.career_paths.services.authoring -> sqlalchemy",
    "abridgeai.features.career_paths.services.enrollment -> sqlalchemy",
    "abridgeai.features.spaced_repetition.services.review -> sqlalchemy",
    "abridgeai.features.spaced_repetition.services.remediation -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Routers do not call queries directly (must go through services)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.routers",
    "abridgeai.features.*.routers.*",
]
forbidden_modules = [
    "abridgeai.features.*.queries",
    "abridgeai.features.*.queries.*",
    "abridgeai.features.*.repositories",
    "abridgeai.features.*.repositories.*",
]
allow_indirect_imports = true
ignore_imports = [
    "abridgeai.features.spaced_repetition.routers.learner -> abridgeai.features.spaced_repetition.queries",
    "abridgeai.features.spaced_repetition.routers.teacher -> abridgeai.features.spaced_repetition.queries",
    # Sub-resource permission deps resolve child-id → course_id via ORM JOINs.
    # No business logic — pure FK-chain resolution for the permission check.
    "abridgeai.features.courses.routers._deps -> abridgeai.features.courses.queries.resolution",
    # Lazy import inside function body to break circular dep at module load.
    # Resolves user's primary org_id for the list-paths default filter.
    "abridgeai.features.career_paths.routers.authoring -> abridgeai.features.career_paths.queries.published",
]

[[tool.importlinter.contracts]]
name = "Features are independent (cross-feature traffic must go through public API)"
type = "independence"
modules = [
    "abridgeai.features.*",
]
ignore_imports = [
    # Allow any feature submodule (at any depth) to import any sibling
    # feature's api.public module. The `**` wildcard is required on the
    # importer side because cross-feature consumers live in nested
    # paths like `features.X.routers.teacher` or `features.X.queries.Y`.
    "abridgeai.features.** -> abridgeai.features.*.api.public",
    # Permanent grandfather: career_paths joins access_control.OrgUnit
    # at the ORM mapper level for the shared schema split predating
    # this refactor (T17 added the relationship; the import direction
    # is one-way and documented).
    "abridgeai.features.career_paths.models -> abridgeai.features.access_control.models",
    # Pre-existing carve-outs for FastAPI router decorators / shared deps
    # that import `access_control.policies` directly (require_permission,
    # require_course_permission, require_any_permission, can_manage_course).
    # These predate the api.public migration and are wired at route-decoration
    # time, not via the public read API.
    "abridgeai.features.** -> abridgeai.features.access_control.policies",
    "abridgeai.features.identity.routers.me -> abridgeai.features.access_control.services",
    # Cross-feature router dependency reuse (FastAPI Depends).
    "abridgeai.features.materials.routers.authoring -> abridgeai.features.courses.routers._deps",
    # Notification dispatch is invoked from spaced_repetition workers /
    # remediation services as a side-effect channel; no public API exists.
    "abridgeai.features.spaced_repetition.workers.scan_due_cards -> abridgeai.features.notifications.services.dispatch",
    "abridgeai.features.spaced_repetition.services.remediation -> abridgeai.features.notifications.services.dispatch",
    # Courses queries JOIN cross-feature models for ORM-hydrated reads.
    # These are read-only JOINs (no writes to foreign tables); the ORM
    # approach replaces raw SQL that previously bypassed the linter.
    "abridgeai.features.courses.queries.** -> abridgeai.features.access_control.models",
    "abridgeai.features.courses.queries.** -> abridgeai.features.identity.models",
    "abridgeai.features.courses.queries.** -> abridgeai.features.enrollments.models",
    # FR-3 outline builder reads DocumentChunk rows to group lesson chunks
    # into sections. Read-only access to the materials model; writes still
    # go through materials' own services.
    "abridgeai.features.quizzes.ai.outline -> abridgeai.features.materials.models",
    # FR-3 outline route exposes the builder result via the courses
    # router (lesson is a courses-feature concept). Cross-feature import
    # is one-way: quizzes' outline builder hydrates from materials.
    "abridgeai.features.courses.routers.authoring -> abridgeai.features.quizzes.ai.outline",
]

[[tool.importlinter.contracts]]
name = "Learner-facing routers do not touch authoring services"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.routers.learner",
]
forbidden_modules = [
    "abridgeai.features.*.services.authoring",
    "abridgeai.features.*.services.administration",
]

[[tool.importlinter.contracts]]
name = "Models are leaf-most (no imports of services or routers)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.models",
    "abridgeai.features.*.models.*",
]
forbidden_modules = [
    "abridgeai.features.*.services",
    "abridgeai.features.*.services.*",
    "abridgeai.features.*.routers",
    "abridgeai.features.*.routers.*",
]

[tool.bandit]
targets = ["abridgeai"]
exclude_dirs = ["tests"]
confidence_level = "MEDIUM"
# B701 (jinja2 autoescape=False) is suppressed: LLM prompts are plain-text,
# not HTML; autoescape would corrupt prompt rendering. The two
# `# noqa: S701` markers in abridgeai/ai/prompts/{env,loader}.py document
# this intent for code reviewers; this skip silences the equivalent
# bandit-level finding.
skips = ["B701"]
tests = [
    "B102",
    "B104",
    "B105", "B106", "B107",
    "B201",
    "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308",
    "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316",
    "B317", "B318", "B319", "B320", "B321", "B322", "B323", "B324",
    "B501", "B502",
    "B601", "B602",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "jsonpath-ng>=1.8.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0",
]
