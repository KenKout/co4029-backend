[project]
name = "abridgeai-backend"
version = "0.1.0"
description = "aBridgeAI backend (restructured) — feature-first architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "neo4j>=5.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "aioboto3>=13.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
    "import-linter>=2.0",
    "moto>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["abridgeai*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
