[project]
name = "abridgeai-backend"
version = "0.1.0"
description = "aBridgeAI backend (restructured) — feature-first architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "neo4j>=5.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyotp>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "aioboto3>=13.0",
    "boto3>=1.34",
    "pyjwt>=2.8",
    "structlog>=24.4",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3",
    "pillow>=10.0",
    # LiveKit server SDK: token minting + room/agent dispatch for the voice
    # interview. Lightweight (no audio/ML deps) so the API/uvicorn image stays
    # lean; the heavy agent runtime lives in the `interview-agent` extra below.
    # Pin >=1.2 (ships livekit-protocol>=1.1.21 with TC_DONE): livekit-agents
    # 1.6.x imports agent_pb.TC_DONE at module load, so an older 1.1.x api/proto
    # crash-loops the agent worker on import. Do NOT relax below 1.2.
    "livekit-api>=1.2,<2",
    "nh3>=0.3.6",
]

[project.optional-dependencies]
# Voice-interview agent worker runtime (Phase 3). Pulls the LiveKit Agents
# framework + Deepgram/OpenAI STT/TTS + silero VAD plugins. Installed only on
# the agent-worker process (`uv sync --extra interview-agent`), never the API.
# Pin >=1.6 (matches the api>=1.2 / protocol>=1.1.21 baseline above).
interview-agent = [
    "livekit-agents>=1.6,<2",
    "livekit-plugins-openai>=1.6,<2",
    "livekit-plugins-silero>=1.6,<2",
    # Deepgram STT (nova-2) + Aura-2 TTS for English voice interviews; Vietnamese
    # falls back to the OpenAI-compatible gateway (Deepgram has no VI locale).
    "livekit-plugins-deepgram>=1.6,<2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.18,<2",
    "import-linter>=2.0",
    "moto[server]>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]
audio-local = [
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=abridgeai --cov-report=term-missing --cov-report=xml --cov-fail-under=75 -m 'not destructive and not voice_live'"
markers = [
    "s3_live: integration test against a real Garage container (skipped by default; run with -m s3_live)",
    "kg_live: integration test against a real Neo4j container (skipped by default; run with -m kg_live)",
    "audio_live: integration test that calls the real Whisper / faster-whisper backend (skipped by default; run with -m audio_live)",
    "video_live: integration test that exercises the real ffmpeg binary (skipped by default; run with -m video_live)",
    "destructive: test that mutates global DB state (alembic round-trip etc.); skipped by default to keep the suite isolated; run with -m destructive",
    "voice_live: live LiveKit voice-interview smoke test (real LiveKit + LLM/STT/TTS; costs money). Excluded from the normal suite and CI; runs only with RUN_LIVEKIT_VOICE_TESTS=1 and -m voice_live.",
]

[tool.coverage.run]
source = ["abridgeai"]
omit = [
    "abridgeai/**/__init__.py",
    "abridgeai/**/migrations/**",
]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,W = pycodestyle errors/warnings; F = pyflakes; I = isort; B = bugbear;
# UP = pyupgrade; N = pep8-naming; S = bandit; C90 = mccabe complexity;
# PT = pytest-style; RET = flake8-return; SIM = simplify; ANN = annotations;
# ASYNC = async; T20 = no print/pprint
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C90", "PT", "RET", "SIM", "ANN", "ASYNC", "T20"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.mccabe]
# Recursive ORM walker (soft_delete_cascade) sits at 12; raise from default 10.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts (S101), broad pytest.raises (PT011),
# and don't need full type annotations (ANN). T20 is allowed in CLI-style
# test helpers (replay_cli, capture); E501 covers long SQL/snapshot strings
# baked into integration tests.
"tests/**/*.py" = ["ANN", "S101", "PT011", "T20", "E501"]
"abridgeai/**/_test_models.py" = ["ANN"]
# Alembic migrations are auto-generated / template-driven. Path is
# `migrations/versions/` in this project (alembic was renamed during the
# T0.5 init).
"migrations/versions/**/*.py" = ["ANN", "E501"]
# eval/ is a manual-trigger eval harness, not part of the production app.
# CLI legitimately writes to stdout/stderr (T20); tests use assert (S101).
"eval/run.py" = ["T20"]
"eval/tests/**/*.py" = ["ANN", "S101", "PT011", "T20", "E501"]
# Voice smoke-test harness — a manual-trigger CLI, not part of the production
# app. Legitimately writes to stdout (T20), uses a timeout kwarg on its own
# async helpers (ASYNC109), and does sync pathlib in async setup (ASYNC240).
"scripts/voice_harness/**/*.py" = ["T20", "E501", "ASYNC109", "ASYNC240", "C901"]
# Security replay harness — a manual-trigger CLI for the security-hardening
# workstream. Legitimately writes to stdout (T20) and has long usage lines
# (E501); imports the corpus loader from the tests tree via sys.path (E402).
"scripts/security_replay.py" = ["T20", "E501", "E402", "I001"]
# Analysis-isolation report — same shape as security_replay.py: a manual-trigger,
# LLM-free CLI that prints a human report to stdout (T20), has long usage lines
# (E501), and imports abridgeai after a sys.path insert (E402).
"scripts/analysis_isolation_report.py" = ["T20", "E501", "E402", "I001"]
# Interview quality report — a manual-trigger, read-only diagnostics CLI
# (calibration / contingency / leading-question metrics over a finished
# session). Prints a human report to stdout (T20), has long usage + rubric
# lines (E501), imports after a sys.path insert (E402/I001), and its report
# printer is a flat sequence of sections rather than genuinely complex logic
# (C901).
"scripts/interview_quality_report.py" = ["T20", "E501", "E402", "I001", "C901"]
# AI cost backfill — a manual-trigger maintenance CLI run after a pricing rate
# is added. Prints a per-model report to stdout (T20) and uses raw SQL by
# design: it sweeps historical rows, so an ORM round-trip per row would be
# both slower and less atomic than one UPDATE.
"scripts/backfill_ai_call_costs.py" = ["T20", "E501"]
# Org-tenancy audit — a manual-trigger, read-only forensic CLI. Prints a
# human report to stdout (T20) and builds its SQL by formatting a table name
# into a template (S608): the names come from a module-level tuple, never from
# input, and the alternative is seven near-identical query constants.
"scripts/audit_org_tenancy.py" = ["T20", "E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
# Keep error output actionable; show error codes for targeted ignores.
show_error_codes = true
warn_unused_ignores = true
# Allow tests/ directory to be discovered as the `tests.*` package
# even though some subdirs lack `__init__.py`. Required so the
# `[[tool.mypy.overrides]] module = "tests.*"` block matches.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "conftest",
    "unit.*",
    "integration.*",
    "characterization.*",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
    "faster_whisper",
    "faster_whisper.*",
    "pytesseract",
    "pytesseract.*",
    "pgvector",
    "pgvector.*",
    # livekit ships no type hints / py.typed marker (agents + plugins). Narrow
    # ignore so the realtime voice modules (agent.py, session_runtime.py) type-
    # check without livekit's untyped surface producing import-untyped noise.
    "livekit",
    "livekit.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The realtime voice modules subclass / consume livekit's Agent + rtc surface.
# livekit ships no stubs, so under ignore_missing_imports those names resolve
# to Any. strict's disallow_subclassing_any would then reject `class
# InterviewAgent(Agent)`. Scope the relaxation to exactly these two modules so
# the rest of the tree keeps full strictness. warn_unused_ignores is disabled
# here too because whether an ignore is "used" depends on whether livekit is
# installed in the checking env (present in the app venv, absent in the
# pre-commit hook venv), and we don't want that env split to break the hook.
module = [
    "abridgeai.features.interviews.realtime.agent",
    "abridgeai.features.interviews.realtime.session_runtime",
]
disallow_subclassing_any = false
warn_unused_ignores = false

[tool.setuptools.packages.find]
include = ["abridgeai*"]

[tool.importlinter]
root_packages = ["abridgeai"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services do not touch SQLAlchemy directly (must go through repositories/queries)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.services",
    "abridgeai.features.*.services.*",
]
forbidden_modules = [
    "sqlalchemy",
    "sqlalchemy.*",
]
allow_indirect_imports = true
ignore_imports = [
    "abridgeai.features.identity.services.login -> sqlalchemy",
    "abridgeai.features.identity.services.session -> sqlalchemy",
    "abridgeai.features.identity.services.mfa -> sqlalchemy",
    "abridgeai.features.identity.services.profile -> sqlalchemy",
    "abridgeai.features.identity.services.admin -> sqlalchemy",
    "abridgeai.features.access_control.services.permissions_lookup -> sqlalchemy",
    "abridgeai.features.courses.services.catalog -> sqlalchemy",
    "abridgeai.features.courses.services.authoring -> sqlalchemy",
    "abridgeai.features.courses.services.assignment -> sqlalchemy",
    "abridgeai.features.courses.services.administration -> sqlalchemy",
    "abridgeai.features.enrollments.services.manager -> sqlalchemy",
    "abridgeai.features.enrollments.services.student_view -> sqlalchemy",
    "abridgeai.features.materials.services.catalog -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._common -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._storage -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._reads -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._upload -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._versions -> sqlalchemy",
    "abridgeai.features.materials.services.authoring._curated_kg -> sqlalchemy",
    # TYPE_CHECKING-only AsyncSession annotation, same as the siblings above.
    "abridgeai.features.materials.services.authoring._preprocess -> sqlalchemy",
    "abridgeai.features.quizzes.services.authoring -> sqlalchemy",
    "abridgeai.features.quizzes.services.publish_gate -> sqlalchemy",
    "abridgeai.features.quizzes.services.taking -> sqlalchemy",
    "abridgeai.features.quizzes.services.grader -> sqlalchemy",
    "abridgeai.features.quizzes.services.generation -> sqlalchemy",
    "abridgeai.features.quizzes.services.question_bank -> sqlalchemy",
    "abridgeai.features.interviews.services.authoring -> sqlalchemy",
    "abridgeai.features.interviews.services.taking -> sqlalchemy",
    "abridgeai.features.interviews.services.evaluation -> sqlalchemy",
    "abridgeai.features.interviews.services.generation -> sqlalchemy",
    # lifecycle only imports AsyncSession for type hints (TYPE_CHECKING);
    # reads go through queries, writes mutate ORM objects. Same carve-out
    # as the sibling interview services above.
    "abridgeai.features.interviews.services.lifecycle -> sqlalchemy",
    "abridgeai.features.admin.services.users -> sqlalchemy",
    "abridgeai.features.admin.services.processing -> sqlalchemy",
    "abridgeai.features.admin.services.audit -> sqlalchemy",
    "abridgeai.features.admin.services.stats -> sqlalchemy",
    "abridgeai.features.admin.services.ai_costs -> sqlalchemy",
    "abridgeai.features.progress.services.tracking -> sqlalchemy",
    "abridgeai.features.progress.services.monitoring -> sqlalchemy",
    "abridgeai.features.progress.services.reporting -> sqlalchemy",
    "abridgeai.features.notifications.services.dispatch -> sqlalchemy",
    "abridgeai.features.notifications.services.email -> sqlalchemy",
    "abridgeai.features.notifications.services.inbox -> sqlalchemy",
    "abridgeai.features.career_paths.services.authoring -> sqlalchemy",
    "abridgeai.features.career_paths.services.enrollment -> sqlalchemy",
    "abridgeai.features.career_paths.services.readiness -> sqlalchemy",
    "abridgeai.features.spaced_repetition.services.review -> sqlalchemy",
    "abridgeai.features.spaced_repetition.services.remediation -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Routers do not call queries directly (must go through services)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.routers",
    "abridgeai.features.*.routers.*",
]
forbidden_modules = [
    "abridgeai.features.*.queries",
    "abridgeai.features.*.queries.*",
    "abridgeai.features.*.repositories",
    "abridgeai.features.*.repositories.*",
]
allow_indirect_imports = true
ignore_imports = [
    "abridgeai.features.spaced_repetition.routers.learner -> abridgeai.features.spaced_repetition.queries",
    "abridgeai.features.spaced_repetition.routers.teacher -> abridgeai.features.spaced_repetition.queries",
    # Sub-resource permission deps resolve child-id → course_id via ORM JOINs.
    # No business logic — pure FK-chain resolution for the permission check.
    "abridgeai.features.courses.routers._deps -> abridgeai.features.courses.queries.resolution",
    # Lazy import inside function body to break circular dep at module load.
    # Resolves user's primary org_id for the list-paths default filter.
    "abridgeai.features.career_paths.routers.authoring -> abridgeai.features.career_paths.queries.published",
]

[[tool.importlinter.contracts]]
name = "Features are independent (cross-feature traffic must go through public API)"
type = "independence"
modules = [
    "abridgeai.features.*",
]
ignore_imports = [
    # Allow any feature submodule (at any depth) to import any sibling
    # feature's api.public module. The `**` wildcard is required on the
    # importer side because cross-feature consumers live in nested
    # paths like `features.X.routers.teacher` or `features.X.queries.Y`.
    "abridgeai.features.** -> abridgeai.features.*.api.public",
    # Permanent grandfather: career_paths joins access_control.OrgUnit
    # at the ORM mapper level for the shared schema split predating
    # this refactor (T17 added the relationship; the import direction
    # is one-way and documented).
    "abridgeai.features.career_paths.models -> abridgeai.features.access_control.models",
    # Pre-existing carve-outs for FastAPI router decorators / shared deps
    # that import `access_control.policies` directly (require_permission,
    # require_course_permission, require_any_permission, can_manage_course).
    # These predate the api.public migration and are wired at route-decoration
    # time, not via the public read API.
    "abridgeai.features.** -> abridgeai.features.access_control.policies",
    "abridgeai.features.identity.routers.me -> abridgeai.features.access_control.services",
    # Cross-feature router dependency reuse (FastAPI Depends).
    "abridgeai.features.materials.routers.authoring -> abridgeai.features.courses.routers._deps",
    # Notification dispatch is invoked from spaced_repetition workers /
    # remediation services as a side-effect channel; no public API exists.
    "abridgeai.features.spaced_repetition.workers.scan_due_cards -> abridgeai.features.notifications.services.dispatch",
    "abridgeai.features.spaced_repetition.services.remediation -> abridgeai.features.notifications.services.dispatch",
    # Localized notification copy (EN/VI) is rendered at creation time via
    # the notifications ``messages`` module. Same side-effect-channel
    # rationale as the dispatch carve-outs above; no public API exists.
    "abridgeai.features.spaced_repetition.workers.scan_due_cards -> abridgeai.features.notifications.messages",
    "abridgeai.features.spaced_repetition.services.remediation -> abridgeai.features.notifications.messages",
    # Cooldown dedup reads the notifications table directly (read-only ORM
    # query for the last SR reminder per student). Same side-effect-channel
    # rationale as the dispatch/messages carve-outs above.
    "abridgeai.features.spaced_repetition.workers.scan_due_cards -> abridgeai.features.notifications.models",
    # Courses queries JOIN cross-feature models for ORM-hydrated reads.
    # These are read-only JOINs (no writes to foreign tables); the ORM
    # approach replaces raw SQL that previously bypassed the linter.
    "abridgeai.features.courses.queries.** -> abridgeai.features.access_control.models",
    "abridgeai.features.courses.queries.** -> abridgeai.features.identity.models",
    "abridgeai.features.courses.queries.** -> abridgeai.features.enrollments.models",
    # FR-3 outline builder reads DocumentChunk rows to group lesson chunks
    # into sections. Read-only access to the materials model; writes still
    # go through materials' own services.
    "abridgeai.features.quizzes.ai.outline -> abridgeai.features.materials.models",
    # FR-3 outline route exposes the builder result via the courses
    # router (lesson is a courses-feature concept). Cross-feature import
    # is one-way: quizzes' outline builder hydrates from materials.
    "abridgeai.features.courses.routers.authoring -> abridgeai.features.quizzes.ai.outline",
    # Question bank service joins courses.Module to surface the parent
    # module title alongside each bank entry. Read-only ORM read; the
    # service never writes courses tables.
    "abridgeai.features.quizzes.services.question_bank -> abridgeai.features.courses.models",
    # Courses visibility + content tree filter on Quiz.status='published'
    # to gate quiz-typed module items inside published course payloads.
    # Read-only ORM JOIN — no writes to quizzes tables. Lazy-imported
    # at call time inside the visibility helper / queries function so
    # module load order stays one-way (quizzes never imports courses).
    "abridgeai.features.courses.visibility -> abridgeai.features.quizzes.models",
    "abridgeai.features.courses.queries.published -> abridgeai.features.quizzes.models",
    # Same pattern as the quizzes carve-out above, for interview-typed
    # module items (FR-3.6): visibility + content tree filter on
    # InterviewConfig.status = 'published'. Read-only ORM JOIN,
    # lazy-imported at call time (interviews never imports courses).
    "abridgeai.features.courses.visibility -> abridgeai.features.interviews.models",
    "abridgeai.features.courses.queries.published -> abridgeai.features.interviews.models",
    # Material visibility clause reads LearningMaterial.visible_to_students
    # (plan §4062). Read-only, lazy-imported at call time.
    "abridgeai.features.courses.visibility -> abridgeai.features.materials.models",
    # assessment_integrity_events is SHARED proctoring infrastructure: the
    # table carries both quiz + interview events (assessment_kind column),
    # but its ORM model happens to live in the interviews feature. The quiz
    # learner router writes quiz-kind integrity rows via that model
    # (lazy-imported at call time). A second ORM class for the same table
    # would collide at mapper registration, so we share the one model.
    "abridgeai.features.quizzes.routers.learner -> abridgeai.features.interviews.models",
]

[[tool.importlinter.contracts]]
name = "Learner-facing routers do not touch authoring services"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.routers.learner",
]
forbidden_modules = [
    "abridgeai.features.*.services.authoring",
    "abridgeai.features.*.services.administration",
]

[[tool.importlinter.contracts]]
name = "Models are leaf-most (no imports of services or routers)"
type = "forbidden"
source_modules = [
    "abridgeai.features.*.models",
    "abridgeai.features.*.models.*",
]
forbidden_modules = [
    "abridgeai.features.*.services",
    "abridgeai.features.*.services.*",
    "abridgeai.features.*.routers",
    "abridgeai.features.*.routers.*",
]

[tool.bandit]
targets = ["abridgeai"]
exclude_dirs = ["tests"]
confidence_level = "MEDIUM"
# B701 (jinja2 autoescape=False) is suppressed: LLM prompts are plain-text,
# not HTML; autoescape would corrupt prompt rendering. The two
# `# noqa: S701` markers in abridgeai/ai/prompts/{env,loader}.py document
# this intent for code reviewers; this skip silences the equivalent
# bandit-level finding.
skips = ["B701"]
tests = [
    "B102",
    "B104",
    "B105", "B106", "B107",
    "B201",
    "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308",
    "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316",
    "B317", "B318", "B319", "B320", "B321", "B322", "B323", "B324",
    "B501", "B502",
    "B601", "B602",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "jsonpath-ng>=1.8.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0",
]
