endpoint: /api/v1/courses
redact_fields:
  - "$.items[*].id"
  - "$.items[*].created_at"
  - "$.items[*].updated_at"
  - "$.items[*].deleted_at"
  - "$.items[*].published_at"
allow_extra_fields:
  - "$.next_cursor"
  - "$.items[*].created_by"
  - "$.items[*].updated_by"
  - "$.items[*].organization_id"
  - "$.items[*].deleted_by"
  - "$.items[*].instructor"
  - "$.items[*].outcomes"
  - "$.items[*].tags"
  - "$.items[*].thumbnail_url"
  - "$.items[*].contact_email"
  - "$.items[*].contact_phone"
  - "$.items[*].contact_website_url"
  - "$.items[*].contact_social_url"
  - "$.items[*].level"
  - "$.items[*].estimated_minutes"
  # Added after the snapshot was captured. The listing is additive by
  # design, so these are tolerated rather than re-captured:
  # `instructors` (plural) superseded the singular `instructor` above.
  - "$.items[*].instructors"
  - "$.items[*].career_paths"
  - "$.items[*].has_syllabus"
strict_match_fields: []
behavior:
  status_code: null
  row_count: "$.items"
